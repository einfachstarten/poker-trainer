<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Poker Companion</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>

<header id="decision" class="wait">
  <div id="decision-main">
    <div id="action">WARTEN</div>
    <div id="gloss"></div>
  </div>
  <button id="think" type="button">Was denkst du?</button>
</header>

<section id="now">
  <p id="why"></p>
  <div id="decision-meta">
    <span id="source"></span>
    <span id="clamp-note"></span>
  </div>
</section>

<section id="happened">
  <h2>Was passiert ist</h2>
  <ul id="events"><li class="empty">Noch nichts.</li></ul>
</section>

<section id="table">
  <div class="cards-row">
    <div class="cards-group">
      <div class="label">Hand</div>
      <div id="hand" class="cards"></div>
    </div>
    <div class="cards-group">
      <div class="label">Board <span id="street"></span></div>
      <div id="board" class="cards"></div>
    </div>
  </div>

  <div id="equity-block">
    <div class="equity-head">
      <span>Gewinnchance <strong id="equity">-</strong></span>
      <span>mindestens nötig <strong id="required">-</strong></span>
    </div>
    <div id="equity-bar"><div id="equity-fill"></div><div id="required-mark"></div></div>
    <div class="equity-foot" id="equity-basis">gegen Zufallshände</div>
  </div>

  <dl id="numbers">
    <div><dt>Pot</dt><dd id="pot">-</dd></div>
    <div><dt>Call</dt><dd id="to-call">-</dd></div>
    <div><dt>Position</dt><dd id="position">-</dd></div>
    <div><dt>Gegner</dt><dd id="opponents-n">-</dd></div>
  </dl>
</section>

<section>
  <h2>Gegner</h2>
  <ul id="opponents"><li class="empty">Noch niemand beobachtet.</li></ul>
</section>

<section id="talk">
  <h2>Gespräch</h2>
  <ol id="transcript"></ol>
  <form id="ask-form">
    <input id="ask" type="text" autocomplete="off" placeholder="Frage tippen, oder rechte Option-Taste halten und sprechen">
    <button type="submit">Fragen</button>
  </form>
</section>

<section id="strategy">
  <h2>Strategie <span id="strategy-name"></span></h2>
  <label><span class="dial">Handauswahl <output id="tightness-value">2</output></span>
    <input id="tightness" type="range" min="1" max="5" step="1" value="2">
    <span class="ends"><span>tight</span><span>loose</span></span></label>
  <label><span class="dial">Aggression <output id="aggression-value">3</output></span>
    <input id="aggression" type="range" min="1" max="5" step="1" value="3">
    <span class="ends"><span>passiv</span><span>aggressiv</span></span></label>
  <label><span class="dial">Bluffs <output id="bluff-value">2</output></span>
    <input id="bluff" type="range" min="1" max="5" step="1" value="2">
    <span class="ends"><span>nie</span><span>oft</span></span></label>
</section>

<footer>
  <span id="status">Startet</span>
  <span id="backend"></span>
</footer>

<script src="panel.js"></script>
</body>
</html>
